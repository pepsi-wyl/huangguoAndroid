import com.android.build.api.artifact.SingleArtifact
import com.android.build.api.artifact.ArtifactTransformationRequest
import org.gradle.process.ExecOperations
import javax.inject.Inject

plugins { id 'com.android.application' }

abstract class GenerateDebugKeystore extends DefaultTask {
    @OutputFile abstract RegularFileProperty getKeyStore()
    @Inject abstract ExecOperations getExecOperations()

    @TaskAction void generate() {
        File output = keyStore.get().asFile
        // Preserve the signing identity even when Gradle history is cleared.
        if (output.isFile()) return
        output.parentFile.mkdirs()
        boolean windows = System.getProperty('os.name').toLowerCase().contains('windows')
        File keytool = new File(System.getProperty('java.home'), windows ? 'bin/keytool.exe' : 'bin/keytool')
        execOperations.exec {
            commandLine keytool, '-genkeypair', '-noprompt',
                '-keystore', output, '-storetype', 'PKCS12', '-storepass', 'android',
                '-alias', 'androiddebugkey', '-keypass', 'android',
                '-keyalg', 'RSA', '-keysize', '2048', '-sigalg', 'SHA256withRSA',
                '-validity', '10000', '-dname', 'CN=APK Debug, O=Local Development, C=CN'
        }
    }
}

def generatedDebugKeystore = rootProject.layout.projectDirectory.file('.generated/debug-signing/debug.keystore')
def generateDebugKeystore = tasks.register('generateDebugKeystore', GenerateDebugKeystore) {
    keyStore.set(generatedDebugKeystore)
    outputs.doNotCacheIf('Private signing keys must stay local') { true }
}

android {
    namespace 'tv.ewtcs.dfynfj.debug'
    compileSdk 34
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'tv.ewtcs.dfynfj.debug'
        minSdk 21
        targetSdk 31
        versionCode 120
        versionName '1.2.0'
    }
    signingConfigs {
        debug {
            storeFile generatedDebugKeystore.asFile
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { debuggable true } }
}

// AGP APK 转换接口确保 Android Studio 部署重打包后的应用。
abstract class RebuildApk extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getInputApks()
    @OutputDirectory abstract DirectoryProperty getOutputApks()
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getDecodedProject()
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getToolsDirectory()
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getSigningKey()
    @Internal abstract DirectoryProperty getSdkDirectory()
    @Internal abstract Property<ArtifactTransformationRequest<RebuildApk>> getTransformationRequest()
    @Inject abstract ExecOperations getExecOperations()
    @Inject abstract FileSystemOperations getFileSystemOperations()
    @TaskAction void rebuild() {
        File decoded = new File(temporaryDir, 'decoded')
        fileSystemOperations.delete { delete decoded }
        fileSystemOperations.copy {
            from decodedProject
            into decoded
            exclude 'build/**', 'dist/**', 'original/**', '**/.DS_Store'
        }
        File manifest = new File(decoded, 'AndroidManifest.xml')
        manifest.setText(manifest.getText('UTF-8')
            .replace('tv.ewtcs.dfynfj', 'tv.ewtcs.dfynfj.debug')
            .replace('android:label="黄果短剧"', 'android:label="黄果短剧 Debug"'), 'UTF-8')
        File tooling = toolsDirectory.get().asFile
        File framework = new File(temporaryDir, 'framework')
        fileSystemOperations.copy { from new File(tooling, 'framework'); into framework }
        boolean windows = System.getProperty('os.name').toLowerCase().contains('windows')
        String javaBin = new File(System.getProperty('java.home'), windows ? 'bin/java.exe' : 'bin/java').absolutePath
        File buildTools = new File(sdkDirectory.get().asFile, 'build-tools/36.0.0')
        File unsigned = new File(temporaryDir, 'unsigned.apk')
        File aligned = new File(temporaryDir, 'aligned.apk')
        File output = outputApks.get().asFile
        output.mkdirs()
        File signed = new File(output, 'hgdj-debug.apk')
        execOperations.exec {
            commandLine javaBin, '-jar', new File(tooling, 'apktool.jar'), 'b', '-f', '-p', framework, decoded, '-o', unsigned
        }
        execOperations.exec {
            commandLine new File(buildTools, windows ? 'zipalign.exe' : 'zipalign'), '-f', '-P', '16', '4', unsigned, aligned
        }
        execOperations.exec {
            commandLine javaBin, '-jar', new File(buildTools, 'lib/apksigner.jar'), 'sign',
                '--ks', signingKey.get().asFile, '--ks-pass', 'pass:android',
                '--key-pass', 'pass:android', '--out', signed, aligned
        }
        execOperations.exec {
            commandLine javaBin, '-jar', new File(buildTools, 'lib/apksigner.jar'), 'verify', signed
        }
        transformationRequest.get().submit(this) { artifact -> signed }
    }
}
androidComponents {
    beforeVariants(selector().all()) { builder ->
        if (builder.buildType != 'debug') builder.enable = false
    }
    onVariants(selector().withBuildType('debug')) { variant ->
        def repack = tasks.register('rebuildDebugApk', RebuildApk) {
            dependsOn generateDebugKeystore
            decodedProject.set(rootProject.layout.projectDirectory.dir('apktool'))
            toolsDirectory.set(rootProject.layout.projectDirectory.dir('tools'))
            signingKey.set(generatedDebugKeystore)
            sdkDirectory.set(androidComponents.sdkComponents.sdkDirectory)
            outputApks.set(layout.buildDirectory.dir('outputs/apk/repacked/debug'))
        }
        def request = variant.artifacts.use(repack)
            .wiredWithDirectories({ it.inputApks }, { it.outputApks })
            .toTransformMany(SingleArtifact.APK.INSTANCE)
        repack.configure { transformationRequest.set(request) }
    }
}

tasks.configureEach {
    if (name == 'validateSigningDebug') dependsOn generateDebugKeystore
}
